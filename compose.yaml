services:
  # Primary MySQL instance
  mysql-primary:
    image: 'mysql:9.5.0'
    container_name: dual-db-mysql-primary
    environment:
      - 'MYSQL_DATABASE=profile-http'
      - 'MYSQL_PASSWORD=53cret'
      - 'MYSQL_ROOT_PASSWORD=53cret'
      - 'MYSQL_USER=yu71'
    ports:
      - '3308:3306'
    volumes:
      - ./mysql_primary_data:/var/lib/mysql
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Secondary MySQL instance (for failover)
  mysql-secondary:
    image: 'mysql:9.5.0'
    container_name: dual-db-mysql-secondary
    environment:
      - 'MYSQL_DATABASE=profile-http'
      - 'MYSQL_PASSWORD=53cret'
      - 'MYSQL_ROOT_PASSWORD=53cret'
      - 'MYSQL_USER=yu71'
    ports:
      - '3309:3306'
    volumes:
      - ./mysql_secondary_data:/var/lib/mysql
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Primary PostgreSQL instance
  postgres-primary:
    image: 'postgres:18'
    container_name: dual-db-postgres-primary
    environment:
      - 'POSTGRES_DB=profile_http'
      - 'POSTGRES_PASSWORD=53cret'
      - 'POSTGRES_USER=yu71'
    ports:
      - '5433:5432'
    volumes:
      - ./postgres_primary_data:/var/lib/postgresql
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U yu71 -d profile_http" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Secondary PostgreSQL instance (for failover)
  postgres-secondary:
    image: 'postgres:18'
    container_name: dual-db-postgres-secondary
    environment:
      - 'POSTGRES_DB=profile_http'
      - 'POSTGRES_PASSWORD=53cret'
      - 'POSTGRES_USER=yu71'
    ports:
      - '5434:5432'
    volumes:
      - ./postgres_secondary_data:/var/lib/postgresql
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U yu71 -d profile_http" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis instance (for HTTP client fallback cache)
  redis:
    image: 'redis:7.4-alpine'
    container_name: dual-db-redis
    ports:
      - '6379:6379'
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Prometheus for metrics collection
  prometheus:
    image: 'prom/prometheus:latest'
    container_name: dual-db-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana for metrics visualization
  grafana:
    image: 'grafana/grafana:latest'
    container_name: dual-db-grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_primary_data:
  mysql_secondary_data:
  postgres_primary_data:
  postgres_secondary_data:
  redis_data:
  prometheus_data:
  grafana_data:
